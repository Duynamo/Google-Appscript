<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#4f6ef7;--pd:#3b56e0;--g:#22c55e;--w:#f59e0b;--d:#ef4444;--or:#f97316;--pu:#8b5cf6;--cy:#06b6d4;
  --sb:#ffffff;--bg:#f1f5f9;--card:#fff;--bdr:#e2e8f0;--sh:0 2px 12px rgba(0,0,0,.07);
  --tx:#1e293b;--t2:#64748b;--t3:#94a3b8;--r:12px;--r2:8px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#a0aec0;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:#f1f5f9;border-radius:6px}
::-webkit-scrollbar-corner{background:#f1f5f9}
#wrap{display:flex;min-height:100vh}
/* ── SIDEBAR (Clean Modern SaaS) ── */
#sb{width:200px;background:var(--sb);position:fixed;top:0;left:0;bottom:0;z-index:300;display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid var(--bdr);box-shadow:1px 0 10px rgba(0,0,0,.03)}
#main{margin-left:200px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.sb-logo{padding:16px 14px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:9px}
.sb-li{width:36px;height:36px;background:linear-gradient(135deg,var(--p),#6366f1);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;box-shadow:0 2px 8px rgba(79,110,247,.25)}
.sb-ln .t1{color:#0f172a;font-weight:700;font-size:12px;letter-spacing:-0.2px}.sb-ln .t2{color:#64748b;font-size:10px}
.sb-usr{padding:10px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;background:#f8fafc}
.sb-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--p),#6366f1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;box-shadow:0 2px 6px rgba(79,110,247,.2)}
.sb-un{color:#0f172a;font-size:12px;font-weight:700;line-height:1.2}
.sb-ur{color:#64748b;font-size:10px;font-weight:600;margin-top:2px}
.sb-nav{flex:1;padding:10px 8px}
.sni{display:flex;align-items:center;gap:9px;padding:8px 10px;color:#475569;border-radius:var(--r2);margin-bottom:2px;cursor:pointer;transition:.15s;font-size:12px;font-weight:500;user-select:none}
.sni:hover{background:#f1f5f9;color:#0f172a}
.sni.active{background:#eef2ff;color:var(--p);font-weight:700;box-shadow:inset 0 0 0 1px rgba(79,110,247,.2)}
.sni .ic{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sb-out{margin:auto 10px 10px;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;color:#ef4444;border-radius:var(--r2);cursor:pointer;font-size:11px;font-weight:600;border:1px solid #fee2e2;background:#fff5f5;transition:.15s;user-select:none}
.sb-out:hover{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
.sb-ft{padding:10px 14px;border-top:1px solid var(--bdr);text-align:center;color:#94a3b8;font-size:10px;background:#f8fafc}
.sb-ft a{color:#64748b;font-weight:600;text-decoration:none}
.sb-ft a:hover{color:var(--p)}
/* ── TOPBAR ── */
#topbar{background:var(--card);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:200}
.tb-l .pgt{font-size:17px;font-weight:700}.tb-l .pgs{font-size:11px;color:var(--t2)}
.tb-r{display:flex;align-items:center;gap:8px}
.tb-srch{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r2);padding:6px 11px;min-width:180px}
.tb-srch input{border:none;background:transparent;outline:none;font-size:12px;width:100%;color:var(--tx)}
.tb-srch input::placeholder{color:var(--t3)}
.pj-filter{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r2);padding:6px 11px;min-width:170px;cursor:pointer;font-size:12px;color:var(--t2);position:relative}
.pj-filter select{border:none;background:transparent;outline:none;font-size:12px;color:var(--tx);cursor:pointer;width:100%}
.btn-mk{display:flex;align-items:center;gap:5px;background:var(--p);color:#fff;border:none;border-radius:var(--r2);padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(79,110,247,.3);transition:.15s}
.btn-mk:hover{background:var(--pd)}
.btn-bell{width:36px;height:36px;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;position:relative;transition:.15s}
.btn-bell:hover{background:var(--bdr)}
.bell-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--d);border-radius:50%;border:2px solid var(--card);display:none}
.btn-lang{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r2);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;position:relative;transition:.15s;color:var(--tx)}
.btn-lang:hover{background:var(--bdr)}
.lang-drop{min-width:210px;padding:5px 0}
.lang-opt{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:12px;cursor:pointer;transition:.1s;color:var(--tx);user-select:none}
.lang-opt:hover{background:var(--bg);color:var(--p)}
.lang-opt.active{background:#eef2ff;color:var(--p);font-weight:700}
.lang-opt .l-check{margin-left:auto;color:var(--p);font-weight:700}
.lang-act{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:11px;color:var(--t2);cursor:pointer;transition:.1s;user-select:none}
.lang-act:hover{background:var(--bg);color:var(--tx)}
.drop-wrap{position:relative}
.drop{position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--bdr);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:500;display:none;overflow:hidden;min-width:190px}
.drop.show{display:block}
.di{display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:12px;cursor:pointer;transition:.1s;color:var(--tx)}
.di:hover{background:var(--bg);color:var(--p)}
.n-drop{min-width:280px;max-height:380px;overflow-y:auto}
.n-hd{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--bdr);font-size:13px;font-weight:600}
.nb{padding:3px 8px;border-radius:4px;border:none;font-size:11px;font-weight:600;cursor:pointer}
.nb-a{background:var(--p);color:#fff}.nb-r{background:var(--bg);color:var(--t2)}
.n-it{display:flex;gap:9px;padding:10px 14px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:.1s}
.n-it:hover{background:var(--bg)}.n-it:last-child{border-bottom:none}
.n-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.n-tx{font-size:11px}.n-tm{font-size:10px;color:var(--t3);margin-top:2px}
/* ── CONTENT ── */
#content{flex:1;padding:18px 20px;overflow-x:hidden}
.page{display:none}.page.active{display:block}
/* ── STAT CARDS ── */
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.sc{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);cursor:pointer;transition:.2s;border-top:3px solid transparent;position:relative;overflow:hidden}
.sc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.sc-p{border-top-color:var(--p)}.sc-g{border-top-color:var(--g)}.sc-or{border-top-color:var(--or)}.sc-d{border-top-color:var(--d)}
.sc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sc-ic{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.ic-p{background:#ede9fe;color:#7c3aed}.ic-g{background:#d1fae5;color:#059669}.ic-or{background:#ffedd5;color:#ea580c}.ic-d{background:#fee2e2;color:#991b1b}
.sc-num{font-size:26px;font-weight:800;line-height:1}.sc-lbl{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.sc-line{width:100%;height:3px;background:var(--bdr);border-radius:2px;overflow:hidden;margin:10px 0 8px}
.sc-bar{height:100%;border-radius:2px;transition:.4s}
.sc-subs{display:flex;justify-content:space-between}
.sc-sub{font-size:11px;color:var(--t3)}.sc-sub b{color:var(--t2)}
/* ── DASH LAYOUT ── */
.d2col{display:grid;grid-template-columns:2fr 3fr;gap:14px;margin-bottom:14px}
.d3col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.d32{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-bottom:14px}
/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.chd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bdr)}
.cti{font-size:13px;font-weight:700}
/* ── ACTIVITY ── */
.act-list{padding:8px 14px;max-height:240px;overflow-y:auto}
.act-it{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--bdr)}
.act-it:last-child{border-bottom:none}
.act-ic{width:26px;height:26px;border-radius:50%;background:#dbeafe;color:var(--p);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:2px}
.act-main .act-ti{font-size:12px;font-weight:600;color:var(--tx)}
.act-main .act-sub{font-size:11px;color:var(--t2);margin-top:1px}
.act-main .act-tm{font-size:10px;color:var(--t3);margin-top:1px}
/* ── PRIORITY TASKS ── */
.ptk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:12px 14px}
.ptk{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;transition:.2s;cursor:pointer}
.ptk:hover{border-color:#c7d7f8;box-shadow:0 4px 12px rgba(79,110,247,.1)}
.ptk.ov{border-color:#fca5a5;background:#fff8f8}
.ptk-nm{font-size:12px;font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between;gap:6px}
.ptk-ds{font-size:10px;color:var(--t2);margin-bottom:7px}
.ptk-rows{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.ptk-row{font-size:10px;color:var(--t2)}
.ptk-bw{background:var(--bdr);border-radius:2px;height:5px;overflow:hidden}
.ptk-bf{height:100%;border-radius:2px}
.ptk-pct{font-size:10px;font-weight:600;text-align:right;margin-top:2px}
/* ── CHARTS ── */
.ccrd{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.cc-ti{font-size:13px;font-weight:700;margin-bottom:11px}
.c-leg{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.c-li{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--t2);padding:2px 7px;border-radius:12px;background:var(--bg);border:1px solid var(--bdr);cursor:pointer;user-select:none;transition:all .15s}
.c-li:hover{border-color:var(--p);background:#fff}
.c-li.has-cnt{font-weight:600;color:var(--t1);background:#fff;border-color:#cbd5e1;box-shadow:0 1px 2px rgba(0,0,0,0.03)}
.c-li.has-cnt:hover{border-color:var(--p);color:var(--p)}
.c-li.no-cnt{opacity:0.45;color:var(--t3);border-style:dashed}
.c-li.no-cnt:hover{opacity:0.8;border-style:solid}
.c-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap}
.bg-gr{background:#d1fae5;color:#065f46}.bg-bl{background:#dbeafe;color:#1e40af}
.bg-or{background:#ffedd5;color:#9a3412}.bg-rd{background:#fee2e2;color:#991b1b}
.bg-yw{background:#fef3c7;color:#92400e}.bg-gy{background:#f1f5f9;color:#475569}
.bg-pu{background:#ede9fe;color:#5b21b6}.bg-cy{background:#cffafe;color:#164e63}
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r2);border:none;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.bp{background:var(--p);color:#fff}.bp:hover{background:var(--pd)}
.bg2{background:var(--g);color:#fff}.bd{background:var(--d);color:#fff}
.bs{background:var(--bg);color:var(--t2);border:1px solid var(--bdr)}.bs:hover{background:var(--bdr)}
.bic{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;border:1px solid var(--bdr);background:var(--bg);color:var(--t2);font-size:12px;cursor:pointer;transition:.15s;padding:0}
.bic:hover{background:var(--p);color:#fff;border-color:var(--p)}
.bic.del:hover{background:var(--d);color:#fff;border-color:var(--d)}
.bic.dup:hover{background:var(--pu);color:#fff;border-color:var(--pu)}
.bic.grn:hover{background:var(--g);color:#fff;border-color:var(--g)}
/* ── PJSEARCH ── */
.psrch{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;padding:5px 9px}
.psrch input{border:none;background:transparent;outline:none;font-size:12px;width:130px}
/* ── PAGE CARDS ── */
.pcrd{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.pcrd-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bdr)}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:11px 16px;border-bottom:1px solid var(--bdr)}
.fsel{background:var(--bg);border:1px solid var(--bdr);border-radius:6px;padding:6px 9px;font-size:11px;outline:none}
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{background:#f8fafc;padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--t2);border-bottom:2px solid var(--bdr);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--bdr);font-size:12px;vertical-align:middle}
tbody tr:hover{background:#f8fafc}
.row-ov{background:#fff8f8}
.progc{display:flex;align-items:center;gap:5px}
.pm{flex:1;background:var(--bdr);border-radius:2px;height:5px;overflow:hidden;min-width:50px}
.pmb{height:100%;border-radius:2px;background:var(--p)}
/* ── TASK MINI STATS ── */
.tk-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--bdr)}
.tk-stat{padding:12px 16px;text-align:center;border-right:1px solid var(--bdr)}
.tk-stat:last-child{border-right:none}
.tk-snum{font-size:16px;font-weight:700}.tk-slbl{font-size:10px;color:var(--t2);margin-top:2px}
/* ── PROJECT GROUP ── */
.pjg{border-bottom:1px solid var(--bdr)}
.pjg-hd{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#f8fafc;cursor:pointer;user-select:none}
.pjg-arr{font-size:11px;transition:.2s;color:var(--t2)}.pjg-arr.open{transform:rotate(90deg)}
.pjg-nm{font-size:13px;font-weight:600;flex:1}.pjg-cnt{font-size:11px;color:var(--t2)}
.pjg-body{display:none}.pjg-body.open{display:block}
/* ── OVERLAY / MODAL ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;padding:12px}
.ov.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:mIn .2s ease}
.modal-lg{max-width:900px}
.modal-xl{max-width:1100px;max-height:95vh}
@keyframes mIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.mhd h3{font-size:15px;font-weight:700}
.mcl{width:26px;height:26px;border:none;background:var(--bg);border-radius:5px;font-size:15px;cursor:pointer;color:var(--t2);display:flex;align-items:center;justify-content:center}
.mcl:hover{background:var(--bdr)}
.mbd{padding:14px 20px}
.mft{padding:0 20px 16px;display:flex;gap:7px;justify-content:flex-end}
.fg{margin-bottom:12px}
.fl{display:block;font-size:11px;font-weight:600;margin-bottom:4px}
.fl .req{color:var(--d)}
.fc{width:100%;padding:8px 10px;border:1.5px solid var(--bdr);border-radius:7px;font-size:12px;outline:none;transition:.15s;background:#fff}
.fc:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
select.fc{background:#fff}
textarea.fc{resize:vertical;min-height:65px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--p)}
/* ── PROJECT DETAIL MODAL ── */
.pd-wrap{display:grid;grid-template-columns:210px 1fr;gap:0;min-height:400px}
.pd-left{background:#f8fafc;border-right:1px solid var(--bdr);padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:80vh}
.pd-stat{background:#fff;border-radius:var(--r2);padding:12px;border:1px solid var(--bdr)}
.pd-stat-num{font-size:20px;font-weight:800}.pd-stat-lbl{font-size:11px;color:var(--t2)}
.pd-prog{margin-top:4px}
.pd-prog-bar{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;margin:4px 0}
.pd-prog-fill{height:100%;border-radius:3px;background:var(--p)}
.pd-prog-pct{font-size:12px;font-weight:700;color:var(--p)}
.pd-right{padding:14px;overflow-y:auto;max-height:70vh}
.pd-tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pd-tcard{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:11px;cursor:pointer;transition:.2s}
.pd-tcard:hover{border-color:#c7d7f8;box-shadow:0 2px 8px rgba(79,110,247,.1)}
.pd-tcard.ov{border-color:#fca5a5;background:#fff8f8}
.pd-tc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.pd-tc-nm{font-size:12px;font-weight:600;flex:1;margin-right:6px}
.pd-tc-id{font-size:10px;color:var(--t3);margin-bottom:3px}
.pd-tc-tags{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0}
.pd-tc-meta{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
.pd-tc-as{font-size:10px;color:var(--t2)}
.pd-tc-acts{display:flex;gap:3px}
.pd-tc-bw{background:var(--bdr);border-radius:2px;height:3px;overflow:hidden;margin-top:5px}
.pd-tc-bf{height:100%;border-radius:2px}
/* ── ALL TASKS MODAL ── */
.at-search{padding:10px 16px;border-bottom:1px solid var(--bdr)}
.at-search input{width:100%;padding:8px 12px;border:1.5px solid var(--bdr);border-radius:7px;font-size:13px;outline:none}
.at-search input:focus{border-color:var(--p)}
.at-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px;max-height:65vh;overflow-y:auto}
.at-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:11px;cursor:pointer;transition:.2s}
.at-card:hover{border-color:#c7d7f8;box-shadow:0 2px 8px rgba(79,110,247,.1)}
.at-card.ov{border-color:#fca5a5}
.at-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.at-nm{font-size:12px;font-weight:600;flex:1;margin-right:4px}
.at-pj{font-size:10px;color:var(--t2);margin-bottom:5px;display:flex;align-items:center;gap:3px}
.at-row{font-size:10px;color:var(--t2);display:flex;align-items:center;gap:4px;margin-top:2px}
.at-bw{background:var(--bdr);border-radius:2px;height:4px;overflow:hidden;margin:6px 0 2px}
.at-bf{height:100%;border-radius:2px}
.at-pct{font-size:10px;font-weight:600;text-align:right}
/* ── TASK FULL EDIT (slide panel) ── */
#task-panel{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:700;display:none}
#task-panel.show{display:flex;align-items:stretch;justify-content:flex-end}
#task-panel-inner{background:#fff;width:90%;max-width:1100px;display:flex;flex-direction:column;overflow:hidden}
.tp-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--bdr);background:#fff;position:sticky;top:0;z-index:1}
.tp-header h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.tp-hacts{display:flex;align-items:center;gap:8px}
.tp-body{flex:1;display:grid;grid-template-columns:1fr 1fr 280px;overflow:hidden}
.tp-col{padding:16px 18px;overflow-y:auto;border-right:1px solid var(--bdr)}
.tp-col:last-child{border-right:none}
.tp-col-ti{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bdr)}
.rm-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 200px);overflow-y:auto}
.rm-item{background:var(--bg);border-radius:var(--r2);padding:10px;position:relative;border-left:3px solid var(--w)}
.rm-date{font-size:10px;color:var(--w);font-weight:600;margin-bottom:3px}
.rm-text{font-size:12px;color:var(--tx)}
.rm-acts{position:absolute;top:6px;right:6px;display:flex;gap:3px}
.lr-area{width:100%;min-height:120px;padding:8px 10px;border:1.5px solid var(--bdr);border-radius:7px;font-size:12px;font-family:inherit;outline:none;resize:vertical;line-height:1.6}
.lr-area:focus{border-color:var(--p)}
.lr-preview{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.lr-link{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--bg);border-radius:5px;font-size:11px;color:var(--p);text-decoration:none;border:1px solid var(--bdr)}
.lr-link:hover{background:#dbeafe}
/* ── GANTT ── */
#page-gantt{position:relative}
.gantt-toolbar{background:var(--card);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--sh)}
.gantt-wrap{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.gantt-inner{display:flex;overflow:hidden;flex:1}
.gantt-left{width:320px;flex-shrink:0;border-right:2px solid var(--bdr);overflow-y:auto;overflow-x:hidden}
.gantt-right{flex:1;overflow-x:auto;overflow-y:auto;position:relative}
.gantt-header-left{padding:10px 14px;background:#f8fafc;border-bottom:2px solid var(--bdr);font-size:11px;font-weight:700;color:var(--t2);height:62px;display:flex;align-items:center}
.gantt-header-right{position:sticky;top:0;z-index:10;background:#f8fafc;border-bottom:2px solid var(--bdr);height:62px;display:flex;flex-direction:column;white-space:nowrap}
.gantt-month-row{display:flex;white-space:nowrap;border-bottom:1px solid var(--bdr)}
.gantt-month-cell{height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--p);background:#eef2ff;border-right:2px solid #c7d7f8;flex-shrink:0;padding:0 4px;white-space:nowrap;overflow:hidden}
.gantt-day-row{display:flex;white-space:nowrap}
.gantt-day{min-width:30px;height:40px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--t2);border-right:1px solid var(--bdr);flex-shrink:0;flex-direction:column;gap:1px}
.gantt-day.today{background:#dbeafe;color:var(--p);font-weight:700}
.gantt-day.weekend{background:#fff8f8}
.gantt-pj-row{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f0f4ff;border-bottom:1px solid var(--bdr);cursor:pointer;user-select:none}
.gantt-pj-ic{font-size:11px;transition:.2s;color:var(--t2)}.gantt-pj-ic.open{transform:rotate(90deg)}
.gantt-pj-nm{font-size:12px;font-weight:700;flex:1}
.gantt-pj-cnt{font-size:10px;color:var(--t2)}
.gantt-pj-line{height:36px;background:#f0f4ff;border-bottom:1px solid var(--bdr);display:flex;align-items:center;position:relative}
.gantt-pj-tasks{display:none}
.gantt-pj-tasks.open{display:block}
.gantt-pj-tasks-r{display:none}
.gantt-pj-tasks-r.open{display:block}
.gantt-tk-row{display:flex;align-items:center;gap:6px;padding:6px 14px 6px 22px;border-bottom:1px solid var(--bdr);cursor:grab;min-height:36px;transition:.1s}
.gantt-tk-row:hover{background:#f8fafc}
.gantt-tk-row.dragging{opacity:.5;background:#e0e7ff}
.gantt-tk-row.drag-over{border-top:2px solid var(--p)}
.gantt-drag-ic{color:var(--t3);font-size:12px;cursor:grab}
.gantt-tk-nm{font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.gantt-tk-as{font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px}
.gantt-tk-line{height:36px;border-bottom:1px solid var(--bdr);position:relative}
.gantt-bar{position:absolute;top:50%;transform:translateY(-50%);height:18px;border-radius:4px;min-width:4px;cursor:pointer;transition:.1s;display:flex;align-items:center;padding:0 5px;font-size:9px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-bar:hover{opacity:.85;box-shadow:0 2px 6px rgba(0,0,0,.2)}
/* Gantt Display Options & Deadline Flags */
.gantt-opt-group{display:inline-flex;align-items:center;gap:8px;background:var(--bg);padding:4px 8px;border-radius:6px;border:1px solid var(--bdr)}
.gantt-cb-opt{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--t2);cursor:pointer;user-select:none;padding:2px 4px;border-radius:4px;transition:.15s}
.gantt-cb-opt:hover{color:var(--p);background:#e0e7ff}
.gantt-cb-opt input{cursor:pointer;margin:0;accent-color:var(--p)}
.gantt-deadline-flag{position:absolute;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:3px;z-index:6;cursor:pointer;user-select:none;line-height:1;transition:.15s}
.gantt-deadline-flag:hover{z-index:25;transform:translateY(-50%) scale(1.05)}
.gantt-flag-icon{font-size:13px;line-height:1;display:inline-block;transition:transform .15s ease;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.gantt-deadline-flag:hover .gantt-flag-icon{transform:scale(1.25)}
.gantt-flag-date{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:#ffffff;border:1px solid var(--bdr);color:var(--t1);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.gantt-deadline-flag.flag-overdue .gantt-flag-date{color:#dc2626;border-color:#fca5a5;background:#fef2f2}
.gantt-deadline-flag.flag-overdue .gantt-flag-icon{animation:flagPulse 1.6s infinite ease-in-out}
.gantt-deadline-flag.flag-done .gantt-flag-date{color:#16a34a;border-color:#86efac;background:#f0fdf4}
.gantt-pj-flag{z-index:8}
.gantt-pj-flag .gantt-flag-date{background:#4f6ef7;color:#fff;border-color:#3b82f6;box-shadow:0 1px 4px rgba(79,110,247,.3)}
.gantt-pj-bar{position:absolute;top:50%;transform:translateY(-50%);height:10px;border-radius:5px;background:#c7d2fe;opacity:.7;border:1px solid #818cf8}
@keyframes flagPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
#gantt-inner.hide-gflags .gantt-flag-icon{display:none!important}
#gantt-inner.hide-gdates .gantt-flag-date{display:none!important}
#gantt-inner.hide-gflags.hide-gdates .gantt-deadline-flag{display:none!important}
/* Staff filter */
.staff-filter-btn{cursor:pointer;min-width:180px;display:flex;align-items:center;justify-content:space-between;gap:8px;user-select:none;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;padding:6px 9px;font-size:11px}
.staff-filter-btn:hover{border-color:var(--p)}
.staff-filter-drop{display:none;position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:500;min-width:220px;max-height:300px;overflow-y:auto}
.staff-cb-row{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--bdr);transition:.1s}
.staff-cb-row:hover{background:#f8fafc}
.staff-cb-all{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:600;border-bottom:2px solid var(--bdr);background:#f8fafc;position:sticky;top:0}
.staff-filter-footer{padding:8px 10px;border-top:1px solid var(--bdr);display:flex;gap:6px;background:#f8fafc;position:sticky;bottom:0}
/* ── TOAST ── */
#toasts{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.toast{padding:10px 16px;border-radius:9px;color:#fff;font-size:12px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:tI .3s ease;min-width:230px;display:flex;gap:7px;max-width:320px}
.ts{background:#22c55e}.te{background:#ef4444}.ti{background:#4f6ef7}
@keyframes tI{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.ldg{display:flex;align-items:center;justify-content:center;padding:32px;color:var(--t3)}
.spn{width:18px;height:18px;border:3px solid var(--bdr);border-top-color:var(--p);border-radius:50%;animation:spin .6s linear infinite;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:28px;color:var(--t3)}.empty-ic{font-size:32px;margin-bottom:8px}

/* ══ NEW: MEMBER PANEL ══ */
.pd-mem-btn{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);padding:8px 10px;cursor:pointer;transition:.15s;font-size:11px;font-weight:600;color:var(--tx);width:100%;justify-content:center}
.pd-mem-btn:hover{border-color:var(--p);color:var(--p);background:#f0f4ff}
.pd-mem-badge{background:var(--p);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700}
.mem-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--p),#6366f1);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mem-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r2);border:1px solid var(--bdr);background:#fff;transition:.15s}
.mem-item:hover{border-color:#c7d7f8;background:#f8fbff}
.mem-list-wrap{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;padding:2px}
.mem-mini-row{display:flex;align-items:center;gap:5px;padding:3px 0}

/* ══ NEW: ASSIGNEE COMBO & MULTI-CHIPS ══ */
.as-combo{position:relative}
.as-combo-box{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:36px;padding:3px 6px;border:1.5px solid var(--bdr);border-radius:7px;background:#fff;cursor:text;transition:.15s}
.as-combo-box:focus-within{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
.as-chips{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px}
.as-chip{display:inline-flex;align-items:center;gap:4px;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;padding:2px 6px 2px 4px;border-radius:12px;font-size:11px;font-weight:500;user-select:none;max-width:100%}
.as-chip-av{width:16px;height:16px;border-radius:50%;background:var(--p);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.as-chip-name{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as-chip-del{cursor:pointer;color:#6366f1;font-size:12px;font-weight:700;line-height:1;margin-left:2px;border-radius:50%;width:13px;height:13px;display:inline-flex;align-items:center;justify-content:center}
.as-chip-del:hover{background:#c7d2fe;color:#1e1b4b}
.as-combo-box .as-combo-inp{border:none!important;box-shadow:none!important;outline:none!important;padding:3px 4px!important;flex:1;min-width:80px;font-size:12px;background:transparent;width:auto}
.as-combo-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--p);border-top:none;border-radius:0 0 7px 7px;z-index:400;max-height:220px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.12);display:none}
.as-combo-list.show{display:block}
.as-opt{padding:7px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.1s}
.as-opt:hover{background:#f0f4ff;color:var(--p)}
.as-opt.selected{background:#f0f7ff;font-weight:600;color:var(--p)}
.as-opt-check{margin-left:auto;color:var(--p);font-size:11px;font-weight:bold;background:#e0e7ff;padding:1px 6px;border-radius:10px}
.as-opt-sep{border-top:1px solid var(--bdr)}
.as-opt-new{color:var(--g);font-weight:600}
.as-opt-new:hover{background:#f0fff4}
.as-opt-clear{color:#ef4444;font-size:11px;font-weight:600;border-bottom:1px solid var(--bdr);padding:6px 10px}
.as-opt-clear:hover{background:#fef2f2}

/* ══ NEW: USER MODE TABS ══ */
.usr-mode-tabs{display:flex;border:1px solid var(--bdr);border-radius:7px;overflow:hidden;margin-bottom:12px}
.usr-mode-tab{flex:1;padding:7px 10px;border:none;cursor:pointer;font-size:11px;font-weight:600;transition:.15s;text-align:center}
.usr-mode-tab.active-full{background:var(--p);color:#fff}
.usr-mode-tab.active-name{background:var(--g);color:#fff}
.usr-mode-tab:not(.active-full):not(.active-name){background:var(--bg);color:var(--t2)}
.usr-mode-tab:not(.active-full):not(.active-name):hover{background:var(--bdr)}
.info-box{border-radius:7px;padding:8px 10px;margin-bottom:10px;font-size:11px}
.info-box-green{background:#f0fff4;border:1px solid #86efac;color:#166534}

/* ── BULK TASK CREATION STYLES ── */
.qtk-tab-btn{padding:9px 18px;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;outline:none;display:inline-flex;align-items:center;gap:6px}
.qtk-tab-btn:hover{color:var(--tx)}
.qtk-tab-btn.active{color:var(--p);border-bottom-color:var(--p);font-weight:700}
.bulk-presets-bar{background:#f8fafc;border:1px solid var(--bdr);border-radius:var(--r2);padding:10px 12px;margin-bottom:12px}
.bulk-prow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 0.9fr;gap:8px;align-items:flex-end}
@media(max-width:768px){.bulk-prow{grid-template-columns:1fr 1fr}}
.bulk-ta{width:100%;font-family:inherit;font-size:12px;padding:9px 11px;border:1.5px solid var(--bdr);border-radius:7px;outline:none;resize:vertical;min-height:85px;line-height:1.5}
.bulk-ta:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
.bulk-preview-wrap{margin-top:10px;border:1px solid var(--bdr);border-radius:var(--r2);overflow:hidden;background:#fff}
.bulk-preview-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f8fafc;border-bottom:1px solid var(--bdr);font-size:11px;font-weight:700;color:var(--tx)}
.bulk-tbl-container{max-height:210px;overflow-y:auto}
.bulk-tbl{width:100%;border-collapse:collapse;font-size:11px;text-align:left}
.bulk-tbl th{background:#f1f5f9;color:var(--t2);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:2}
.bulk-tbl td{padding:5px 6px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.bulk-tbl tr:hover td{background:#fafbfc}
.bulk-cell-inp{width:100%;padding:5px 7px;border:1px solid var(--bdr);border-radius:5px;font-size:11px;outline:none;background:#fff;transition:.15s}
.bulk-cell-inp:focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(79,110,247,.1)}
.bulk-hint-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:7px 11px;font-size:11px;color:#1e40af;margin-bottom:10px;display:flex;align-items:center;gap:6px;line-height:1.4}

/* ══ ADVANCED ANALYTICS STYLES ══ */
.an-wrap{padding:14px 20px;display:flex;flex-direction:column;gap:16px}
.an-toolbar{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:var(--sh)}
.an-tb-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.an-tb-lbl{font-size:12px;font-weight:700;color:var(--tx)}
.an-date-inputs{display:flex;align-items:center;gap:6px}
.an-date-inp{width:125px;padding:5px 7px;font-size:11px;border:1px solid var(--bdr);border-radius:6px;background:var(--bg);color:var(--tx)}
.an-presets{display:flex;gap:4px;flex-wrap:wrap}
.an-preset-btn{background:var(--bg);border:1px solid var(--bdr);border-radius:20px;padding:3px 9px;font-size:11px;cursor:pointer;color:var(--t2);font-weight:600;transition:.15s}
.an-preset-btn:hover{background:var(--bdr);color:var(--tx)}
.an-preset-btn.active{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 2px 6px rgba(79,110,247,.25)}
.an-tb-divider{width:1px;height:22px;background:var(--bdr);margin:0 2px}
.an-sel{font-size:12px;padding:5px 8px;border:1px solid var(--bdr);border-radius:6px;background:var(--bg);color:var(--tx);min-width:150px;cursor:pointer}
.an-filter-summary-badge{margin-left:auto;font-size:11px;font-weight:600;padding:4px 10px;background:#eef2ff;color:var(--p);border-radius:20px;border:1px solid rgba(79,110,247,.2)}

.an-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.an-kpi-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);transition:transform .15s}
.an-kpi-card:hover{transform:translateY(-2px)}
.an-kpi-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.an-kpi-val{font-size:20px;font-weight:800;color:var(--tx);line-height:1.2}
.an-kpi-lbl{font-size:11px;color:var(--t2);font-weight:600;margin-top:2px}

.an-chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.an-chart-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column}
.an-chart-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:1px solid #f1f5f9;padding-bottom:8px}
.an-chart-ti{font-size:13px;font-weight:700;color:var(--tx)}
.an-chart-sub{font-size:11px;color:var(--t2);font-weight:500}

.an-table-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.an-table-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.an-table{width:100%;border-collapse:collapse;font-size:12px}
.an-table th{background:#f8fafc;color:var(--t2);font-weight:700;padding:9px 10px;border-bottom:1.5px solid var(--bdr);text-align:left;position:sticky;top:0;z-index:2}
.an-table td{padding:9px 10px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.an-table tr:hover td{background:#fafbfc}
.an-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.an-badge-gold{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.an-badge-blue{background:#e0e7ff;color:#3730a3;border:1px solid #c7d2fe}
.an-badge-green{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.an-badge-warn{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}

.an-pj-tag{display:inline-block;padding:2px 6px;background:#f1f5f9;color:var(--tx);border-radius:4px;font-size:10px;margin:1px 2px;border:1px solid var(--bdr)}
